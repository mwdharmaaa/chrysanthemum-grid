<!DOCTYPE html>
<html lang="en" data-color-mode="dark" data-dark-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>GitHub Contribution Calendar Test Harness</title>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .profile-container {
      width: 860px;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 24px;
      background-color: #161b22;
    }
    h2 {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
    }
    .js-calendar-graph {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .ContributionCalendar-grid {
      border-collapse: separate;
      border-spacing: 3px;
    }
    .ContributionCalendar-day {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      outline: 1px solid rgba(27, 31, 35, 0.06);
      outline-offset: -1px;
    }
    /* Native GitHub defaults */
    [data-level="0"] { background-color: #161b22; }
    [data-level="1"] { background-color: #0e4429; }
    [data-level="2"] { background-color: #006d32; }
    [data-level="3"] { background-color: #26a641; }
    [data-level="4"] { background-color: #39d353; }
    .footer-note {
      margin-top: 20px;
      font-size: 12px;
      color: #8b949e;
    }
  </style>
  <link rel="stylesheet" href="../src/styles/chrysanthemum.css">
  <link rel="stylesheet" href="../src/styles/gold_typography.css">
</head>
<body>
  <!-- Header Bar -->
  <header style="width: 860px; display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding: 10px 16px; background: #010409; border: 1px solid #30363d; border-radius: 6px;">
    <span style="font-weight: 600;">GitHub</span>
    <a href="#" class="AppHeader-context-item" style="color: #58a6ff; text-decoration: none; font-weight: 600;">mwdharmaa</a>
  </header>

  <div class="profile-container" id="user-profile-frame">
    <!-- UnderlineNav Tabs -->
    <nav class="UnderlineNav" style="display: flex; gap: 16px; margin-bottom: 20px; border-bottom: 1px solid #30363d; padding-bottom: 10px;">
      <a href="#overview" class="UnderlineNav-item selected" aria-current="page" style="font-weight: 600; text-decoration: none;">Overview</a>
      <a href="#repos" class="UnderlineNav-item" style="color: #58a6ff; text-decoration: none;">Repositories <span class="Counter" style="padding: 2px 6px; border-radius: 10px; font-size: 11px;">37</span></a>
      <a href="#projects" class="UnderlineNav-item" style="color: #58a6ff; text-decoration: none;">Projects</a>
      <a href="#packages" class="UnderlineNav-item" style="color: #58a6ff; text-decoration: none;">Packages</a>
      <a href="#stars" class="UnderlineNav-item" style="color: #58a6ff; text-decoration: none;">Stars</a>
    </nav>

    <!-- Pinned Items -->
    <div style="margin-bottom: 24px;">
      <h3 style="font-size: 14px; margin-bottom: 10px; color: #e6edf3;">Pinned</h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="pinned-item-list-item" style="border: 1px solid #30363d; border-radius: 6px; padding: 12px; background: #0d1117;">
          <a href="#" class="text-bold" style="color: #58a6ff; text-decoration: none; font-size: 14px;"><span class="repo">laraportfolio</span></a>
        </div>
        <div class="pinned-item-list-item" style="border: 1px solid #30363d; border-radius: 6px; padding: 12px; background: #0d1117;">
          <a href="#" class="text-bold" style="color: #58a6ff; text-decoration: none; font-size: 14px;"><span class="repo">mwdhrmaaa</span></a>
        </div>
        <div class="pinned-item-list-item" style="border: 1px solid #30363d; border-radius: 6px; padding: 12px; background: #0d1117;">
          <a href="#" class="text-bold" style="color: #58a6ff; text-decoration: none; font-size: 14px;"><span class="repo">mybudget</span></a>
        </div>
      </div>
    </div>

    <h2>
      <span>1,428 contributions in the last year</span>
      <span style="margin-left: auto; font-size: 13px;">
        <a href="#settings" class="Link--primary" style="color: #58a6ff;">Contribution settings</a>
      </span>
    </h2>

    <div class="js-calendar-graph">
      <table class="ContributionCalendar-grid">
        <tbody id="calendarBody"></tbody>
      </table>
    </div>

    <p class="footer-note">Offline fixture simulating GitHub profile calendar DOM structure.</p>
  </div>

  <script src="../src/core/palette_config.js"></script>
  <script src="../src/features/gold_styler.js"></script>
  <script src="../src/features/calendar_observer.js"></script>
  <script src="../src/content_main.js"></script>
  <script>
    // Build 7 rows x 52 columns of simulated days
    const tbody = document.getElementById("calendarBody");
    for (let row = 0; row < 7; row++) {
      const tr = document.createElement("tr");
      for (let col = 0; col < 52; col++) {
        const td = document.createElement("td");
        td.className = "ContributionCalendar-day";
        // Seed reproducible pattern
        const rand = ((row * 13 + col * 7) % 100);
        let level = 0;
        if (rand > 85) level = 4;
        else if (rand > 65) level = 3;
        else if (rand > 45) level = 2;
        else if (rand > 25) level = 1;

        td.setAttribute("data-level", level.toString());
        td.setAttribute("data-date", `2026-05-${col % 28 + 1}`);
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
  </script>
</body>
</html>
