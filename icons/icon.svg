<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#223348" />
      <stop offset="100%" stop-color="#0e1520" />
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe27a" />
      <stop offset="50%" stop-color="#e5ad42" />
      <stop offset="100%" stop-color="#9a6a24" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ffd55c" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bgGlow)" stroke="#30435b" stroke-width="2" />

  <!-- Outer Petals Ring (Chrysanthemum Geometry) -->
  <g transform="translate(64,64)" filter="url(#shadow)">
    <!-- 8 Outer Petals -->
    <rect x="-6" y="-48" width="12" height="28" rx="6" fill="url(#goldGradient)" />
    <rect x="-6" y="-48" width="12" height="28" rx="6" fill="url(#goldGradient)" transform="rotate(45)" />
    <rect x="-6" y="-48" width="12" height="28" rx="6" fill="url(#goldGradient)" transform="rotate(90)" />
    <rect x="-6" y="-48" width="12" height="28" rx="6" fill="url(#goldGradient)" transform="rotate(135)" />
    <rect x="-6" y="-48" width="12" height="28" rx="6" fill="url(#goldGradient)" transform="rotate(180)" />
    <rect x="-6" y="-48" width="12" height="28" rx="6" fill="url(#goldGradient)" transform="rotate(225)" />
    <rect x="-6" y="-48" width="12" height="28" rx="6" fill="url(#goldGradient)" transform="rotate(270)" />
    <rect x="-6" y="-48" width="12" height="28" rx="6" fill="url(#goldGradient)" transform="rotate(315)" />

    <!-- 8 Inner Petals -->
    <rect x="-5" y="-36" width="10" height="22" rx="5" fill="#ffd452" transform="rotate(22.5)" />
    <rect x="-5" y="-36" width="10" height="22" rx="5" fill="#ffd452" transform="rotate(67.5)" />
    <rect x="-5" y="-36" width="10" height="22" rx="5" fill="#ffd452" transform="rotate(112.5)" />
    <rect x="-5" y="-36" width="10" height="22" rx="5" fill="#ffd452" transform="rotate(157.5)" />
    <rect x="-5" y="-36" width="10" height="22" rx="5" fill="#ffd452" transform="rotate(202.5)" />
    <rect x="-5" y="-36" width="10" height="22" rx="5" fill="#ffd452" transform="rotate(247.5)" />
    <rect x="-5" y="-36" width="10" height="22" rx="5" fill="#ffd452" transform="rotate(292.5)" />
    <rect x="-5" y="-36" width="10" height="22" rx="5" fill="#ffd452" transform="rotate(337.5)" />

    <!-- Center Core -->
    <circle r="14" fill="#fff3c4" stroke="#e5ad42" stroke-width="3" />
    <circle r="7" fill="#df982a" />
  </g>
</svg>
